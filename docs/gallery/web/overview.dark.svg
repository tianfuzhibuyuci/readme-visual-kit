<svg xmlns="http://www.w3.org/2000/svg" width="800" height="908" viewBox="0 0 800 908" role="img" aria-labelledby="title desc">
<title id="title">Pocket Notes · 口袋笔记 — 写下内容，留在自己的浏览器</title><desc id="desc">输入一条笔记: 在页面文本框中输入内容。. 点击保存: 把文本写入当前来源的浏览器本地存储。. 下次打开，继续编辑: 同一来源重新加载时读取笔记；不跨设备同步。</desc>
