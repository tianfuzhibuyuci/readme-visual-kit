<text x="40" y="107.4" font-size="38" font-weight="700" fill="#f1f5fd">写下内容，留在自己的浏览器</text><text x="40" y="164.6" font-size="21" font-weight="400" fill="#b3bfd2">一条笔记，一个浏览器。不注册，不上传。</text><g fill="none" stroke="#52637d" stroke-width="2" marker-end="url(#arrow)"><path d="M 400 390 C 400 418, 400 411, 400 439"/><path d="M 400 608 C 400 636, 400 629, 400 657"/></g><g><rect x="40" y="230" width="720" height="160" rx="18" fill="#1b273a" stroke="#52637d"/><text x="64" y="260" fill="#8eb4ff" font-size="15" font-weight="700" letter-spacing="2">01 / FLOW</text><text x="64" y="296" font-size="27" font-weight="650" fill="#f1f5fd">输入一条笔记</text><text x="64" y="338.8" font-size="22" font-weight="400" fill="#b3bfd2">在页面文本框中输入内容。</text></g><g><rect x="40" y="448" width="720" height="160" rx="18" fill="#1b273a" stroke="#52637d"/><text x="64" y="478" fill="#8eb4ff" font-size="15" font-weight="700" letter-spacing="2">02 / FLOW</text><text x="64" y="514" font-size="27" font-weight="650" fill="#f1f5fd">点击保存</text><text x="64" y="556.8" font-size="22" font-weight="400" fill="#b3bfd2">把文本写入当前来源的浏览器本地存储。</text></g><g><rect x="40" y="666" width="720" height="160" rx="18" fill="#1b273a" stroke="#52637d"/><text x="64" y="696" fill="#8eb4ff" font-size="15" font-weight="700" letter-spacing="2">03 / FLOW</text><text x="64" y="732" font-size="27" font-weight="650" fill="#f1f5fd">下次打开，继续编辑</text><text x="64" y="774.8" font-size="22" font-weight="400" fill="#b3bfd2">同一来源重新加载时读取笔记；不跨设备同步。</text></g>
