<text x="40" y="107.4" font-size="38" font-weight="700" fill="#f1f5fd">页面负责交互，浏览器负责保存</text><text x="40" y="164.6" font-size="21" font-weight="400" fill="#b3bfd2">一条笔记，一个浏览器。不注册，不上传。</text><g fill="none" stroke="#52637d" stroke-width="2" marker-end="url(#arrow)"><path d="M 400 390 C 400 418, 400 411, 400 439"/><path d="M 400 608 C 400 636, 400 629, 400 657"/></g><g><rect x="40" y="230" width="720" height="160" rx="18" fill="#1b273a" stroke="#52637d"/><text x="64" y="260" fill="#8eb4ff" font-size="15" font-weight="700" letter-spacing="2">01 / COMPONENT</text><text x="64" y="296" font-size="27" font-weight="650" fill="#f1f5fd">输入界面</text><text x="64" y="338.8" font-size="22" font-weight="400" fill="#b3bfd2">文本框、保存按钮和状态提示。</text></g><g><rect x="40" y="448" width="720" height="160" rx="18" fill="#1b273a" stroke="#52637d"/><text x="64" y="478" fill="#8eb4ff" font-size="15" font-weight="700" letter-spacing="2">02 / COMPONENT</text><text x="64" y="514" font-size="27" font-weight="650" fill="#f1f5fd">保存事件</text><text x="64" y="556.8" font-size="22" font-weight="400" fill="#b3bfd2">读取输入内容，处理存储失败。</text></g><g><rect x="40" y="666" width="720" height="160" rx="18" fill="#1b273a" stroke="#52637d"/><text x="64" y="696" fill="#8eb4ff" font-size="15" font-weight="700" letter-spacing="2">03 / COMPONENT</text><text x="64" y="732" font-size="27" font-weight="650" fill="#f1f5fd">localStorage</text><text x="64" y="774.8" font-size="22" font-weight="400" fill="#b3bfd2">存储一条字符串；不是服务器数据库。</text></g>
<text x="40" y="882" fill="#b3bfd2" font-size="14">README VISUAL KIT · SOURCE-REFERENCED / REVIEW BEFORE PUBLISHING</text></g></svg>
