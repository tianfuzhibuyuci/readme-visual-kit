<title id="title">Pocket Notes · 口袋笔记 — 页面负责交互，浏览器负责保存</title><desc id="desc">输入界面: 文本框、保存按钮和状态提示。. 保存事件: 读取输入内容，处理存储失败。. localStorage: 存储一条字符串；不是服务器数据库。</desc>
