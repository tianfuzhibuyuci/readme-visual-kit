<title id="title">Pocket Notes · 口袋笔记 — 在本地试写第一条笔记</title><desc id="desc">准备 Python: 使用 Python 3 提供静态文件服务。 — python --version. 启动本地服务: 在 examples/web 目录运行以下命令。 — python -m http.server 8000 --bind 127.0.0.1. 打开页面并保存: 浏览器访问此地址，输入内容，再点击保存笔记。 — http://127.0.0.1:8000</desc>
