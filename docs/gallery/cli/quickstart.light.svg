3 / STEP</text><text x="64" y="977" font-size="27" font-weight="650" fill="#17243b">Save the result</text><text x="64" y="1019.8" font-size="22" font-weight="400" fill="#58677d">Redirect the printed JSON to a new file.</text><rect x="64" y="1060.6" width="672" height="52" rx="10" fill="#eff3fa"/><text x="78" y="1088.6" font-size="20" font-weight="400" fill="#17243b" font-family="ui-monospace, Consolas, monospace">node main.mjs sample.md &gt; links.json</text></g>
