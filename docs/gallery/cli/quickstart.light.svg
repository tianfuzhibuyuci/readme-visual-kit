<title id="title">Linklist — Your first result in three steps</title><desc id="desc">Check the runtime: Use Node.js 22 or newer. — node --version. Run the sample: From examples/cli, read the included Markdown file. — node main.mjs sample.md. Save the result: Redirect the printed JSON to a new file. — node main.mjs sample.md &gt; links.json</desc>
