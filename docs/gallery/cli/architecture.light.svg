<svg xmlns="http://www.w3.org/2000/svg" width="800" height="993" viewBox="0 0 800 993" role="img" aria-labelledby="title desc">
<title id="title">Linklist — Three parts. Nothing hosted.</title><desc id="desc">Markdown file: A local file supplied as the CLI argument.. Link extractor: A small regex plus a Set; not a full Markdown parser.. JSON output: Write the unique links to stdout.</desc>
