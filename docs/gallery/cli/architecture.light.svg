<text x="40" y="107.4" font-size="38" font-weight="700" fill="#17243b">Three parts. Nothing </text><text x="40" y="160.6" font-size="38" font-weight="700" fill="#17243b">hosted.</text><text x="40" y="217.8" font-size="21" font-weight="400" fill="#58677d">Turn a Markdown file into a clean list of links.</text><g fill="none" stroke="#c9d3e2" stroke-width="2" marker-end="url(#arrow)"><path d="M 400 444 C 400 472, 400 465, 400 493"/><path d="M 400 693 C 400 721, 400 714, 400 742"/></g><g><rect x="40" y="284" width="720" height="160" rx="18" fill="#ffffff" stroke="#c9d3e2"/><text x="64" y="314" fill="#2058c9" font-size="15" font-weight="700" letter-spacing="2">01 / COMPONENT</text><text x="64" y="350" font-size="27" font-weight="650" fill="#17243b">Markdown file</text><text x="64" y="392.8" font-size="22" font-weight="400" fill="#58677d">A local file supplied as the CLI argument.</text></g><g><rect x="40" y="502" width="720" height="191" rx="18" fill="#ffffff" stroke="#c9d3e2"/><text x="64" y="532" fill="#2058c9" font-size="15" font-weight="700" letter-spacing="2">02 / COMPONENT</text><text x="64" y="568" font-size="27" font-weight="650" fill="#17243b">Link extractor</text><text x="64" y="610.8" font-size="22" font-weight="400" fill="#58677d">A small regex plus a Set; not a full </text><text x="64" y="641.5999999999999" font-size="22" font-weight="400" fill="#58677d">Markdown parser.</text></g><g><rect x="40" y="751" width="720" height="160" rx="18" fill="#ffffff" stroke="#c9d3e2"/><text x="64" y="781" fill="#2058c9" font-size="15" font-weight="700" letter-spacing="2">03 / COMPONENT</text><text x="64" y="817" font-size="27" font-weight="650" fill="#17243b">JSON output</text><text x="64" y="859.8" font-size="22" font-weight="400" fill="#58677d">Write the unique links to stdout.</text></g>
