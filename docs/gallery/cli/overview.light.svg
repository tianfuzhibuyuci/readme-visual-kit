<title id="title">Linklist — From Markdown to useful links</title><desc id="desc">Start with one file: Read a Markdown document from disk.. Keep the links, skip the noise: Extract simple inline HTTP(S) links and remove duplicates.. Get a portable result: Print a JSON array to standard output. No network calls.</desc>
