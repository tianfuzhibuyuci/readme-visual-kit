name: test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - run: node scripts/cli.mjs check examples/cli/visuals.json --root examples/cli
      - run: node scripts/cli.mjs check examples/web/visuals.json --root examples/web
      - run: node scripts/cli.mjs check examples/library/visuals.json --root examples/library
